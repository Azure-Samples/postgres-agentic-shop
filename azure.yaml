# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: retail-solution-accelerator
description: Agentic Shop
metadata:
    template: retail-solution-accelerator@0.0.1
requiredVersions:
    azd: ">= 1.15.0"

hooks:
    preprovision:
        windows:
            shell: pwsh
            interactive: true
            continueOnError: false
            run: |
                Write-Host "Running capacity validation..." -ForegroundColor Yellow
                ./azd-hooks/preprovision-checklist.ps1
                if ($LASTEXITCODE -ne 0) {
                    # Validation failed - script already showed error and cleaned up
                    exit $LASTEXITCODE
                }
                Write-Host "Capacity validation completed successfully!" -ForegroundColor Green
                Write-Host "Running environment setup..." -ForegroundColor Yellow
                ./azd-hooks/preprovision.ps1
        posix:
            shell: sh
            interactive: true
            continueOnError: false
            run: |
                set -e
                echo "Running capacity validation..."
                bash ./azd-hooks/preprovision-checklist.sh
                echo "Capacity validation completed successfully!"
                echo "Running environment setup..."
                bash ./azd-hooks/preprovision.sh
    postprovision:
        windows:
            shell: pwsh
            interactive: true
            continueOnError: false
            run: |
                ./azd-hooks/postprovision.ps1
        posix:
            shell: sh
            interactive: true
            continueOnError: false
            run: |
                bash ./azd-hooks/postprovision.sh

workflows:
  up:
    steps:
      - azd: provision

infra:
    bicep: ./infra/main.bicep

services:
    backend:
        project: ./backend
        language: py
        module: backend
        host: containerapp
        docker:
            registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
            remoteBuild: true
    frontend:
        project: ./frontend
        language: ts
        module: frontend
        host: containerapp
        docker:
            context: ./
            registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
            path: ./Dockerfile
            remoteBuild: true
        hooks:
            prebuild:
                windows:
                    shell: pwsh
                    interactive: true
                    continueOnError: false
                    run: |
                        $beAppEndpoint = azd env get-value SERVICE_BACKEND_URI
                        $envLine = "VITE_BE_APP_ENDPOINT=`"$beAppEndpoint/`""
                        Out-File -Path ".\.env.local" -InputObject $envLine
                posix:
                    shell: sh
                    interactive: true
                    continueOnError: false
                    run: |
                        set -eu
                        be_app_endpoint="$(azd env get-value SERVICE_BACKEND_URI)"
                        printf 'VITE_BE_APP_ENDPOINT="%s/"\n' "${be_app_endpoint%/}" > ./.env.local
            postdeploy:
                windows:
                    shell: pwsh
                    interactive: true
                    continueOnError: false
                    run: |
                        if (Test-Path -Path ".\.env.local") {
                            Remove-Item -Path ".\.env.local" -Force
                        }
                posix:
                    shell: sh
                    interactive: true
                    continueOnError: false
                    run: |
                        rm -f ./.env.local
    arize:
        project: ./arize-phoenix
        language: py
        module: arize
        host: containerapp
        docker:
            registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
            remoteBuild: true
